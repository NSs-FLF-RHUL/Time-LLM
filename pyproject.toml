[project]
authors = [{ email = "joanna.berteaud@rhul.ac.uk", name = "Joanna Berteaud" }]
classifiers = [
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "torch",
  "numpy",
  "matplotlib",
  "accelerate",
  "scipy",
  "einops",
  "pandas",
  "scikit_learn",
  "tqdm",
  "peft",
  "transformers[tiktoken,sentencepiece]",
  "deepspeed",
  "sentencepiece",
]
description = "Reprogramming framework to repurpose LLMs for general time series forecasting."
dynamic = ["version"]
keywords = []
license = "GPL-3.0"
license-files = ["LICENSE.md"]
name = "timellm"
readme = "README.md"
requires-python = ">=3.11,<3.14"
urls.homepage = "https://github.com/NSs-FLF-RHUL/Time-LLM"

[project.optional-dependencies]
test = ["pytest"]
dev = ["mypy", "pre-commit", "ruff"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "setuptools-scm"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/tingan/_version.py"

[tool.pytest.ini_options]
addopts = ["--color=yes", "--import-mode=importlib", "--verbose"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src", "dataset"]

[tool.mypy]
explicit_package_bases = true

[tool.ruff]
fix = true
force-exclude = true
lint.ignore = [
  "COM812", # trailing commas (ruff-format recommended)
  "D203",   # no-blank-line-before-class
  "D212",   # multi-line-summary-first-line
  "D407",   # removed dashes lines under sections
  "D417",   # argument description in docstring (unreliable)
  "ISC001", # simplify implicit str concatenation (ruff-format recommended)
  "PLR2004", # magic values
]
lint.per-file-ignores = { "tests*" = [
  "ANN001", # Missing type annotation for argument
  "D100",   # Missing docstring in public module
  "D401",   # 1st line should be imperative
  "INP001", # File is part of an implicit namespace package.
  "PLR0913",# Too many arguments to function.
  "PT028",  # Test function has default value
  "S101",   # Use of `assert` detected
], "scripts*" = [
  "D100",   # Missing docstring in public module
  "D401",   # 1st line should be imperative
  "INP001", # File is part of an implicit namespace package.
  "T201",   # print found (JB)
] }
lint.select = ["ALL"]
lint.isort.known-first-party = ["timellm"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]